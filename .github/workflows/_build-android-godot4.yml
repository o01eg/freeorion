name: "Android Godot4"

on:
  workflow_call:
env:
  GODOT_VERSION: "4.7.2"
jobs:
  android:
    name: ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        arch: [x86_64, armeabi-v7a, arm64-v8a]
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Download SDK
        id: download-sdk
        uses: suisei-cn/actions-download-file@v1
        with:
          url: https://github.com/freeorion/freeorion-sdk/releases/download/v19/FreeOrionSDK_19_Android-${{ matrix.arch }}.zip
          target: ../
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r24
          add-to-path: false
      - name: Configure
        run: |
          unzip -q ../${{ steps.download-sdk.outputs.filename }} -d ..
          mkdir build
          pushd build
          FO_SDK=$(realpath ../..)
          cmake -DANDROID_ABI=${{ matrix.arch }} -DANDROID_PLATFORM=24 -DANDROID_NDK=${{ steps.setup-ndk.outputs.ndk-path }} -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_TOOLCHAIN_FILE=${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake -DCMAKE_CXX_FLAGS=-std=c++14 -DANDROID_ALLOW_UNDEFINED_SYMBOLS=Off -DBUILD_PARSERS=On -DBUILD_SERVER=On -DBUILD_AI=On -DBUILD_CLIENT_GG=OFF -DBoost_INCLUDE_DIR=${FO_SDK}/include/ -DBoost_USE_STATIC_LIBS=On -DBoost_LIBRARY_DIR=${FO_SDK}/lib/ -DBUILD_CLIENT_GODOT=4 -DICUI18N_LIBRARY=${FO_SDK}/lib/libicui18n.a -DICUUC_LIBRARY=${FO_SDK}/lib/libicuuc.a -DICUDATA_LIBRARY=${FO_SDK}/lib/libicudata.a -DICONV_LIBRARY=${FO_SDK}/lib/libiconv.so -DPython3_LIBRARY=${FO_SDK}/lib/libpython3.11.a -DPython3_INCLUDE_DIR=${FO_SDK}/include/python3.11/ -DGODOTCPP_API_VERSION=4.4 ..
      - name: Build
        run: |
          pushd build
          cmake --build . -- -j5
      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: android-binaries-godot4-${{ matrix.arch }}
          path: |
            godot4/bin/**/*.so
            godot4/android-plugin/src/main/jniLibs/**/*.so
          if-no-files-found: error
          retention-days: 1
  merge-binaries:
    name: Merge binaries
    runs-on: ubuntu-latest
    needs: android
    steps:
      - name: Merge binaries
        uses: actions/upload-artifact/merge@v7
        with:
          name: android-binaries-godot4
          pattern: android-binaries-godot4-*
          delete-merged: true
          retention-days: 1
  export-android:
    name: Export Android
    runs-on: ubuntu-latest
    needs: merge-binaries
    steps:
      - name: Checkout sources
        uses: actions/checkout@v6
      - name: Download python library
        id: download-python-lib
        uses: suisei-cn/actions-download-file@v1
        with:
          url: https://github.com/freeorion/freeorion-sdk/releases/download/v19/python311.zip
          target: ../
      - name: Place resources
        run: |
          mv default/data/art godot4/assets/
          mv default/data/fonts godot4/assets/
          mv default/data/sound godot4/assets/
          mkdir -p godot4/default/
          mv default/scripting godot4/default/
          mv default/stringtables godot4/default/
          mv default/python godot4/default/
          mkdir -p godot4/default/python/lib/
          cp ../${{ steps.download-python-lib.outputs.filename }} godot4/default/python/lib/python311.zip
          unzip -t godot4/default/python/lib/python311.zip
      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          name: android-binaries-godot4
          path: godot4/
      - name: Install Godot and Templates
        run: |
          wget --content-disposition "https://downloads.godotengine.org/?version=${{ env.GODOT_VERSION }}&flavor=stable&slug=linux.x86_64.zip&platform=linux.64"
          wget --content-disposition "https://downloads.godotengine.org/?version=${{ env.GODOT_VERSION }}&flavor=stable&slug=export_templates.tpz&platform=templates"

          unzip Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64.zip
          sudo mv Godot_v${{ env.GODOT_VERSION }}-stable_linux.x86_64 /usr/local/bin/godot

          mkdir -p ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable
          unzip Godot_v${{ env.GODOT_VERSION }}-stable_export_templates.tpz
          mv templates/* ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/
      - name: Install Android build template into project
        run: |
          mkdir -p godot4/android/build
          unzip -o -q ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.stable/android_source.zip -d godot4/android/build
          echo -n "" > godot4/android/build/.gdignore
          echo -n "${{ env.GODOT_VERSION }}.stable" > godot4/android/.build_version
          ls -la godot4/android/build
      - name: Set up Java and Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android Build Tools
        run: |
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.11.1"
      - name: Build FreeOrion Android plugin
        run: |
          cd godot4/android-plugin
          gradle assembleDebug --no-daemon
          mkdir -p ../android/plugins
          cp build/outputs/aar/*-debug.aar ../android/plugins/freeorion-debug.aar
          cat > ../android/plugins/freeorion.gdap <<'EOF'
          [config]
          name="FreeOrion"
          binary_type="local"
          binary="res://android/plugins/freeorion-debug.aar"
          EOF
          ls -la ../android/plugins/
      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
      - name: Configure Godot Editor Settings
        run: |
          mkdir -p ~/.config/godot/
          cat <<EOF > ~/.config/godot/editor_settings-4.tres
          [gd_resource type="EditorSettings" format=3]

          [resource]
          export/android/android_sdk_path = "${{ env.ANDROID_HOME }}"
          export/android/timestamping_authority_url = ""
          export/android/shutdown_timestamping = true
          EOF

          sed -i 's|keystore/debug=""|keystore/debug="${{ github.workspace }}/debug.keystore"|' godot4/export_presets.cfg
          sed -i 's|keystore/debug_user=""|keystore/debug_user="androiddebugkey"|' godot4/export_presets.cfg
          sed -i 's|keystore/debug_password=""|keystore/debug_password="android"|' godot4/export_presets.cfg
      - name: Export APK via Godot CLI
        run: |
          cd godot4
          godot --headless -v --export-debug "Android" ../freeorion.apk
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: android-godot4
          path: freeorion.apk
          if-no-files-found: error
          retention-days: 1
  run-android:
    name: Run Android
    runs-on: ubuntu-24.04
    needs: export-android
    steps:
      - uses: actions/cache@v5
        id: avd-cache
        with:
          path: |
            ~/.android/avd/*
            ~/.android/adb*
            ~/.android/debug.keystore
          key: avd-test-godot-v2
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: run emulator to generate snapshot for caching
        if: steps.avd-cache.outputs.cache-hit != 'true'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: Galaxy Nexus
          cores: 2
          sdcard-path-or-size: 1G
          avd-name: test
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          working-directory: ./
          channel: beta
          script: echo "Generated AVD snapshot for caching."
      - name: Checkout sources
        uses: actions/checkout@v6
        with:
          sparse-checkout: .github/android-apk-launch.sh
      - name: Dowload APK
        uses: actions/download-artifact@v8
        with:
          name: android-godot4
          path: .
      - name: run game on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: Galaxy Nexus
          cores: 2
          sdcard-path-or-size: 1G
          avd-name: test
          force-avd-creation: false
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: false
          working-directory: ./
          channel: beta
          script: bash .github/android-apk-launch.sh 4
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: android-test-logs-godot4-${{ github.run_number }}
          path: |
            freeorion*.log
            logcat.log
          if-no-files-found: error
          retention-days: 1
