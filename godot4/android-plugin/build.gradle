plugins {
    id "com.android.library" version "8.5.2"
}

android {
    namespace "org.freeorion.godot"
    compileSdk 33

    defaultConfig {
        minSdk 21
        targetSdk 33
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "org.godotengine:godot:4.7.2.stable"
}
